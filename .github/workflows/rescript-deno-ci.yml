# SPDX-License-Identifier: MPL-2.0
permissions:
  contents: read

name: ReScript/Deno CI
on: [push, pull_request]
npermissions:
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
npermissions:
  contents: read

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2
        with:
          deno-version: v1.x
npermissions:
  contents: read


      - name: Deno lint
        run: deno lint

      - name: Deno fmt check
        run: deno fmt --check

      - name: Deno test
        run: deno test --allow-all --coverage=coverage

      - name: ReScript build
        run: |
          if [ -f "rescript.json" ] || [ -f "bsconfig.json" ]; then
            npm install
            npx rescript
          fi

      - name: Type check
        run: deno check **/*.ts || true

  security:
    runs-on: ubuntu-latest
npermissions:
  contents: read

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2
      - name: Check permissions
        run: |
          # Audit for dangerous permissions
          grep -rE "allow-run|allow-write|allow-env" . || echo "No dangerous permissions"
