# Trustfile Validation - A2ML v2.1 integrity checks

name: Trustfile Validation

on:
  push:
    paths:
      - 'bofig.trustfile.a2ml'
      - '.github/workflows/trustfile.yml'
  pull_request:
    paths:
      - 'bofig.trustfile.a2ml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate A2ML YAML structure
        run: |
          python3 -c "
          import yaml
          with open('bofig.trustfile.a2ml') as f:
              data = yaml.safe_load(f)
          required = ['meta', 'threat_model', 'trustfile', 'lean4_proofs', 'signature_block']
          for section in required:
              assert section in data, f'Missing required section: {section}'
          print('A2ML structure valid: all required sections present.')
          "

      - name: Verify trustfile integrity hash
        run: |
          if command -v sha3sum &>/dev/null; then
            sha3sum -a 512 bofig.trustfile.a2ml
          else
            echo "sha3sum not available, using sha256sum fallback"
            sha256sum bofig.trustfile.a2ml
          fi

      - name: Check SPDX header
        run: |
          head -1 bofig.trustfile.a2ml | grep -q "SPDX-License-Identifier" || \
            (echo "Missing SPDX header" && exit 1)
          echo "SPDX header present."

      - name: Hypatia scan placeholder
        run: echo "Hypatia scan placeholder - install hypatia CLI for full scanning."
