# Nginx reverse proxy configuration for Evidence Graph (bofig)
# Install: cp deploy/nginx.conf /etc/nginx/sites-available/evidence-graph
#          ln -s /etc/nginx/sites-available/evidence-graph /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx

# Upstream Phoenix application
upstream evidence_graph {
    server 127.0.0.1:4000;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name evidencegraph.org www.evidencegraph.org;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name evidencegraph.org www.evidencegraph.org;

    # ---------------------------------------------------------------------------
    # SSL/TLS — Let's Encrypt (certbot)
    # Generate: certbot certonly --webroot -w /var/www/certbot -d evidencegraph.org -d www.evidencegraph.org
    # ---------------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/evidencegraph.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evidencegraph.org/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/evidencegraph.org/chain.pem;

    # Modern TLS configuration (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;

    # ---------------------------------------------------------------------------
    # Security headers
    # ---------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------------
    # Request limits
    # ---------------------------------------------------------------------------
    client_max_body_size 20M;

    # ---------------------------------------------------------------------------
    # Static assets — served directly by Nginx with long cache TTL
    # Phoenix fingerprints assets, so aggressive caching is safe.
    # ---------------------------------------------------------------------------
    location /assets/ {
        alias /app/lib/evidence_graph-0.1.0/priv/static/assets/;
        access_log off;
        expires max;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # Favicon and robots.txt
    location = /favicon.ico {
        alias /app/lib/evidence_graph-0.1.0/priv/static/favicon.ico;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /robots.txt {
        alias /app/lib/evidence_graph-0.1.0/priv/static/robots.txt;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------------------------------------------------------------------------
    # LiveView WebSocket — must support upgrades
    # ---------------------------------------------------------------------------
    location /live/ {
        proxy_pass http://evidence_graph;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-specific timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # LiveView long-poll fallback
    location /live/longpoll {
        proxy_pass http://evidence_graph;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------------------
    # GraphQL endpoint
    # ---------------------------------------------------------------------------
    location /api/graphql {
        proxy_pass http://evidence_graph;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # GraphQL queries can be large
        client_max_body_size 5M;
    }

    # GraphQL WebSocket subscriptions (Absinthe)
    location /api/graphql/websocket {
        proxy_pass http://evidence_graph;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---------------------------------------------------------------------------
    # All other requests — proxy to Phoenix
    # ---------------------------------------------------------------------------
    location / {
        proxy_pass http://evidence_graph;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Standard timeouts
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ---------------------------------------------------------------------------
    # Deny access to hidden files (except .well-known)
    # ---------------------------------------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
    }
}
