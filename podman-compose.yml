# podman-compose.yml - Local development services for Evidence Graph (bofig)
# Usage: podman-compose up -d

services:
  arangodb:
    image: docker.io/arangodb/arangodb:3.11
    container_name: evidence_graph_arango
    ports:
      - "8529:8529"
    environment:
      ARANGO_ROOT_PASSWORD: dev
    volumes:
      - arango_data:/var/lib/arangodb3
      - arango_apps:/var/lib/arangodb3-apps
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8529/_api/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: evidence_graph_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evidence_graph_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Containerfile
    container_name: evidence_graph_app
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: ecto://postgres:postgres@postgres:5432/evidence_graph_dev
      ARANGO_ENDPOINT: http://arangodb:8529
      ARANGO_DATABASE: evidence_graph
      ARANGO_USERNAME: root
      ARANGO_PASSWORD: dev
      SECRET_KEY_BASE: "generate-with-mix-phx-gen-secret-for-production"
      PHX_HOST: localhost
      PORT: "4000"
    depends_on:
      arangodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  arango_data:
  arango_apps:
  postgres_data:
